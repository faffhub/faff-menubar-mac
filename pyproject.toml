[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faff-menubar-mac"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rumps",
    "faff-core",
]

[project.scripts]
faff-menubar = "faff_menubar_mac.main:main"

[tool.setuptools.packages.find]
where = ["src"]
